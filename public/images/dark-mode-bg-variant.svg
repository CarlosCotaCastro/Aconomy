<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Base dark background -->
    <radialGradient id="baseGradient" cx="50%" cy="50%" r="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:1" />
    </radialGradient>
    
    <!-- Main gradient circles with enhanced positioning -->
    <radialGradient id="primaryCircle" cx="15%" cy="85%" r="55%">
      <stop offset="0%" style="stop-color:#007bff;stop-opacity:0.18" />
      <stop offset="30%" style="stop-color:#4a90e2;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#007bff;stop-opacity:0" />
    </radialGradient>
    
    <radialGradient id="secondaryCircle" cx="85%" cy="15%" r="55%">
      <stop offset="0%" style="stop-color:#ff0096;stop-opacity:0.16" />
      <stop offset="30%" style="stop-color:#e94785;stop-opacity:0.10" />
      <stop offset="100%" style="stop-color:#ff0096;stop-opacity:0" />
    </radialGradient>
    
    <radialGradient id="tertiaryCircle" cx="45%" cy="35%" r="45%">
      <stop offset="0%" style="stop-color:#8a2be2;stop-opacity:0.12" />
      <stop offset="40%" style="stop-color:#6a4c93;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#8a2be2;stop-opacity:0" />
    </radialGradient>
    
    <!-- Enhanced blur effects with authentic colors -->
    <radialGradient id="topBlur" cx="55%" cy="35%" r="65%">
      <stop offset="0%" style="stop-color:#810ca8;stop-opacity:0.12" />
      <stop offset="40%" style="stop-color:#5a3d6b;stop-opacity:0.09" />
      <stop offset="80%" style="stop-color:#3c0013;stop-opacity:0.06" />
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:0" />
    </radialGradient>
    
    <radialGradient id="bottomBlur" cx="35%" cy="65%" r="45%">
      <stop offset="0%" style="stop-color:#c147e9;stop-opacity:0.10" />
      <stop offset="40%" style="stop-color:#e94785;stop-opacity:0.08" />
      <stop offset="80%" style="stop-color:#3c0029;stop-opacity:0.06" />
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:0" />
    </radialGradient>
    
    <!-- Enhanced filters for more authentic blur -->
    <filter id="softBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="35"/>
    </filter>
    
    <filter id="heavyBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="55"/>
    </filter>
    
    <filter id="ultraBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="80"/>
    </filter>
  </defs>
  
  <!-- Base dark background with subtle gradient -->
  <rect width="100%" height="100%" fill="#0a0a0f"/>
  
  <!-- Main gradient layers -->
  <rect width="100%" height="100%" fill="url(#primaryCircle)"/>
  <rect width="100%" height="100%" fill="url(#secondaryCircle)"/>
  <rect width="100%" height="100%" fill="url(#tertiaryCircle)"/>
  
  <!-- Primary blur effects (matching CSS ::before) -->
  <ellipse cx="960" cy="300" rx="768" ry="200" fill="url(#topBlur)" filter="url(#softBlur)" opacity="0.85"/>
  
  <!-- Secondary blur effects (matching CSS ::after) -->
  <ellipse cx="1450" cy="950" rx="400" ry="180" fill="url(#bottomBlur)" filter="url(#heavyBlur)" opacity="0.9"/>
  
  <!-- Additional atmospheric depth -->
  <circle cx="300" cy="800" r="180" fill="#4a90e2" opacity="0.04" filter="url(#ultraBlur)"/>
  <circle cx="1600" cy="200" r="140" fill="#c147e9" opacity="0.05" filter="url(#ultraBlur)"/>
  <circle cx="800" cy="400" r="100" fill="#7b68ee" opacity="0.06" filter="url(#softBlur)"/>
  <circle cx="1200" cy="700" r="120" fill="#810ca8" opacity="0.04" filter="url(#ultraBlur)"/>
  
  <!-- Subtle noise overlay for texture -->
  <rect width="100%" height="100%" fill="url(#baseGradient)" opacity="0.02"/>
</svg>
