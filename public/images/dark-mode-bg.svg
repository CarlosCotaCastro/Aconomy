<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Base dark background gradient -->
    <radialGradient id="baseGradient" cx="50%" cy="50%" r="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:1" />
    </radialGradient>
    
    <!-- Primary gradient circle (left side - blue tones) -->
    <radialGradient id="primaryCircle" cx="20%" cy="80%" r="50%">
      <stop offset="0%" style="stop-color:#007bff;stop-opacity:0.15" />
      <stop offset="50%" style="stop-color:#007bff;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#007bff;stop-opacity:0" />
    </radialGradient>
    
    <!-- Secondary gradient circle (top right - purple/pink tones) -->
    <radialGradient id="secondaryCircle" cx="80%" cy="20%" r="50%">
      <stop offset="0%" style="stop-color:#ff0096;stop-opacity:0.15" />
      <stop offset="50%" style="stop-color:#ff0096;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#ff0096;stop-opacity:0" />
    </radialGradient>
    
    <!-- Tertiary gradient circle (center - purple) -->
    <radialGradient id="tertiaryCircle" cx="40%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#8a2be2;stop-opacity:0.1" />
      <stop offset="50%" style="stop-color:#8a2be2;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#8a2be2;stop-opacity:0" />
    </radialGradient>
    
    <!-- Top blur effect -->
    <radialGradient id="topBlur" cx="60%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#810ca8;stop-opacity:0.10" />
      <stop offset="60%" style="stop-color:#3c0013;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#3c0013;stop-opacity:0" />
    </radialGradient>
    
    <!-- Bottom blur effect -->
    <radialGradient id="bottomBlur" cx="40%" cy="60%" r="40%">
      <stop offset="0%" style="stop-color:#e94785;stop-opacity:0.08" />
      <stop offset="60%" style="stop-color:#3c0029;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#3c0029;stop-opacity:0" />
    </radialGradient>
    
    <!-- Blur filter for soft effects -->
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="40"/>
    </filter>
    
    <filter id="heavyBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="60"/>
    </filter>
  </defs>
  
  <!-- Base dark background -->
  <rect width="100%" height="100%" fill="url(#baseGradient)"/>
  
  <!-- Primary gradient circles -->
  <rect width="100%" height="100%" fill="url(#primaryCircle)"/>
  <rect width="100%" height="100%" fill="url(#secondaryCircle)"/>
  <rect width="100%" height="100%" fill="url(#tertiaryCircle)"/>
  
  <!-- Top blur effect (scaled and positioned like ::before) -->
  <ellipse cx="960" cy="324" rx="768" ry="216" fill="url(#topBlur)" filter="url(#blur)" opacity="0.8"/>
  
  <!-- Bottom blur effect (positioned like ::after) -->
  <ellipse cx="1536" cy="972" rx="384" ry="162" fill="url(#bottomBlur)" filter="url(#heavyBlur)" opacity="0.9"/>
  
  <!-- Additional atmospheric effects -->
  <circle cx="384" cy="864" r="200" fill="#007bff" opacity="0.03" filter="url(#blur)"/>
  <circle cx="1536" cy="216" r="150" fill="#ff0096" opacity="0.04" filter="url(#blur)"/>
  <circle cx="768" cy="432" r="120" fill="#8a2be2" opacity="0.05" filter="url(#blur)"/>
  
  <!-- Subtle overlay pattern for texture -->
  <rect width="100%" height="100%" fill="url(#baseGradient)" opacity="0.1"/>
</svg>
